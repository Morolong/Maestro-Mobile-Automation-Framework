appId: com.saucelabs.mydemoapp.android
---

- runFlow: ../../flows/authentication/navigate-to-login.yaml

- runFlow:
    file: ../../flows/authentication/login.yaml
    env:
      USERNAME: "bod@example.com"
      PASSWORD: "10203040"
      
- runFlow: ../../flows/authentication/logout.yaml

- assertVisible: "Login"

- assertVisible: "Username"

- assertVisible: "Password"

- assertVisible:
    text: "Login"
    index: 1
